[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supromen"
version = "0.1.0"
description = "CLI for the Supromen Booked Scheduler instance."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ben Goosman" }]
dependencies = [
    "typer>=0.12.3",
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
    "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.0",
]

[project.scripts]
supromen = "supromen.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/supromen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
